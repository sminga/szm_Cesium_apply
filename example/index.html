<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cesium-wind-layer-3d example</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="status">⏳ 正在加载 3D 风场数据…</div>
    <div id="panel">
      <h3>cesium-wind-layer-3d</h3>
      <label>粒子数 <input id="particles" type="range" min="64" max="512" step="64" value="256" /></label>
      <label>速度 <input id="speed" type="range" min="0.1" max="5" step="0.1" value="1" /></label>
      <label>高度拉伸 <input id="height" type="range" min="1" max="50" step="1" value="10" /></label>
      <label>最大线长 <input id="length" type="range" min="20" max="3000" step="20" value="400" /></label>
      <label>动画 <input id="dynamic" type="checkbox" checked /></label>
      <button id="zoom">飞到风场</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
